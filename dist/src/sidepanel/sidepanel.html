<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI Vision Sidebar</title>
    <script type="module" crossorigin src="/sidepanel.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/settings.storage-DiQpYRtg.js">
    <link rel="stylesheet" crossorigin href="/sidepanel.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <span class="eyebrow">VISION TOOL</span>
          <h1>AI Vision Solver</h1>
        </div>
        <span id="statusDot" class="dot" aria-label="Ready"></span>
      </header>
      <section aria-labelledby="settings-title">
        <div class="section-head">
          <h2 id="settings-title">Settings</h2>
          <span id="saved" role="status"></span>
        </div>
        <label
          >Provider<select id="provider">
            <option value="openrouter">OpenRouter</option>
            <option value="openai">OpenAI Direct</option>
          </select></label
        ><label
          >API key
          <div class="key-row">
            <input id="apiKey" type="password" autocomplete="off" /><button
              id="toggleKey"
              class="icon-btn"
              type="button"
              aria-label="Show API key"
            >
              Show
            </button>
          </div></label
        ><label
          >Vision model<input
            id="model"
            placeholder="Enter a currently available image-capable model" /></label
        ><label>Custom prompt<textarea id="prompt" rows="7"></textarea></label>
        <div class="actions">
          <button id="save" class="primary" type="button">Save settings</button
          ><button id="reset" type="button">Reset prompt</button>
        </div>
      </section>
      <section aria-labelledby="solve-title">
        <div class="section-head"><h2 id="solve-title">Solve</h2></div>
        <button id="solve" class="solve" type="button">Solve current page</button>
        <div id="loading" class="loading" hidden>
          <span class="spinner"></span><span>Reading the visible page…</span>
        </div>
        <p id="status" class="status" role="status">Ready when you are.</p>
        <article id="result" class="result" hidden>
          <div class="result-label">ANSWER</div>
          <h3 id="answer"></h3>
          <dl>
            <dt>Question</dt>
            <dd id="question"></dd>
            <dt>Type</dt>
            <dd id="type"></dd>
            <dt>Answer text</dt>
            <dd id="answerText"></dd>
            <dt>Explanation</dt>
            <dd id="explanation"></dd>
            <dt>Confidence</dt>
            <dd id="confidence"></dd>
          </dl>
          <p id="warning" class="warning" hidden></p>
        </article>
        <article id="error" class="error" hidden>
          <strong>Couldn’t solve this page</strong>
          <p id="errorText"></p>
          <button id="retry" type="button">Retry</button>
          <details>
            <summary>Technical details</summary>
            <pre id="errorDetails"></pre>
          </details>
        </article>
      </section>
    </main>
  </body>
</html>
